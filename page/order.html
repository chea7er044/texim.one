<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDER | TEXIM ONE</title>
    <!-- Връщаме се една папка назад (../), за да заредим CSS файла -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- HEADER / НАВИГАЦИЯ -->
    <header class="header">
        <nav class="navbar">
            <a href="../index.html" class="logo">
                <img src="../logo.svg" alt="TEXIM ONE" class="logo-img">
            </a>

            <div class="header-features">
                <div class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                    <span>ПРЕДВАРИТЕЛНО ПЛАЩАНЕ</span>
                </div>
                <div class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11c0 .6-.4 1-1 1h-2"></path><path d="M14 9h4l3 3v6h-7V9z"></path><circle cx="7.5" cy="18.5" r="2.5"></circle><circle cx="17.5" cy="18.5" r="2.5"></circle></svg>
                    <span>БЕЗПЛАТНА ДОСТАВКА</span>
                </div>
                <div class="feature-item">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    <span>БЕЗПЛАТНО ВРЪЩАНЕ</span>
                </div>

                <!-- Тъй като сме в page/order.html, тук пише само order.html -->
                <a href="order.html" class="header-order-link">
                    <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span>ПОРЪЧАЙ</span>
                </a>
            </div>

            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">COLLECTION</a></li>
                <li><a href="../index.html#n7200" class="nav-link">N7200</a></li>
                <li><a href="../index.html#n7211" class="nav-link">N7211</a></li>
                <li><a href="../index.html#n7610" class="nav-link">N7610</a></li>
                <li><a href="../index.html#n9007" class="nav-link">N9007</a></li>
                <li><a href="../index.html#n9087" class="nav-link">N9087</a></li>
                <li><a href="../index.html#n9307" class="nav-link">N9307</a></li>
            </ul>
        </nav>
    </header>

    <!-- СЪДЪРЖАНИЕ / ФОРМА ЗА ПОРЪЧКА -->
    <main class="page-content">
        <div class="order-form-container">
            <h2>Направи Поръчка</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="name">Две имена</label>
                    <input type="text" id="name" required placeholder="Иван Иванов">
                </div>

                <div class="form-group">
                    <label for="phone">Телефон за връзка</label>
                    <input type="tel" id="phone" required placeholder="0888123456">
                </div>

                <div class="form-group">
                    <label for="product">Изберете артикул</label>
                    <select id="product" required>
                        <option value="">-- Изберете модел --</option>
                        <option value="N7200">N7200 - Unisex Heavyweight T-Shirt</option>
                        <option value="N7211">N7211 - Unisex Heavyweight Long Sleeve</option>
                        <option value="N7610">N7610 - Womens Heavyweight Boxy T-Shirt</option>
                        <option value="N9007">N9007 - Heavyweight Hoodie</option>
                        <option value="N9087">N9087 - Heavyweight Sweatshirt</option>
                        <option value="N9307">N9307 - Zip Hoodie</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="size">Размер</label>
                    <select id="size" required>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="2XL">2XL</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="boxnow">Офис / Автомат на BOX NOW</label>
                    <input type="text" id="boxnow" required placeholder="Име или номер на автомата">
                </div>

                <button type="submit" class="submit-btn">Изпрати поръчката</button>
                <div class="form-status" id="formStatus"></div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-container">
            <ul class="footer-links">
                <li><a href="../index.html">Начало</a></li>
                <li><a href="order.html">Поръчай</a></li>
            </ul>
        </div>
    </footer>

    <!-- Връщаме се една папка назад (../), за да заредим JS файла -->
    <script src="../script.js"></script>
</body>
</html>
